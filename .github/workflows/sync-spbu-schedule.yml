name: Sync SPbU timetable

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Request timetable sync
        env:
          PLANER_URL: ${{ secrets.PLANER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --location --silent --show-error --output "${response_file}" --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PLANER_URL}/api/schedule/sync")"
          cat "${response_file}"
          test "${status}" = "200"
